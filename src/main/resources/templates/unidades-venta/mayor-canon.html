<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking de unidades con mayor canon - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Ranking de unidades con mayor canon</h4>
        </div>
        <div class="card-body">

            <p class="text-muted">Festival: <strong th:text="${festival.nombre}"></strong></p>

            <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                <span th:text="${mensajeError}"></span>
            </div>

            <div th:if="${reporte != null and #lists.isEmpty(reporte)}" class="alert alert-info">
                El festival no tiene unidades de venta.
            </div>

            <table th:if="${reporte != null and !#lists.isEmpty(reporte)}" class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre comercial</th>
                    <th>Código</th>
                    <th>Tipo de unidad</th>
                    <th>Canon</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r, st : ${reporte}">
                    <td th:text="${st.count}"></td>
                    <td th:text="${r.nombreComercial}"></td>
                    <td th:text="${r.codigo}"></td>
                    <td th:text="${r.tipoUnidad}"></td>
                    <td th:text="${'$ ' + #numbers.formatDecimal(r.canon, 1, 'POINT', 2, 'COMMA')}"></td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/admin/festivales/{id}/unidades(id=${idFestival})}" class="btn btn-link mt-3">Volver</a>
        </div>
    </div>
</div>

</body>
</html>
