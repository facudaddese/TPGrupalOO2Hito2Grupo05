<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Unidad de Venta - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Modificar Unidad de Venta</h4>
        </div>
        <div class="card-body">

            <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                <span th:text="${mensajeError}"></span>
            </div>

            <form th:action="@{/unidades-venta/editar/{id}(id=${unidadId})}" th:object="${unidadDTO}" method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Código</label>
                        <input type="text" th:field="*{codigo}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Superficie (m²)</label>
                        <input type="number" th:field="*{superficie}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Guardar cambios</button>
                    <a th:href="@{/unidades-venta(idFestival=${idFestival})}"
                       class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
