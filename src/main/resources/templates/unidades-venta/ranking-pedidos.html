<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking de unidades con más pedidos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Ranking de unidades con más pedidos</h4>
        </div>
        <div class="card-body">

            <p class="text-muted">Festival: <strong th:text="${festival.nombre}"></strong></p>

            <div th:if="${#lists.isEmpty(unidades)}" class="alert alert-info">
                El festival no tiene unidades de venta.
            </div>

            <table th:unless="${#lists.isEmpty(unidades)}" class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre comercial</th>
                    <th>Código</th>
                    <th>Cantidad de pedidos</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u, st : ${unidades}">
                    <td th:text="${st.count}"></td>
                    <td th:text="${u.nombreComercial}"></td>
                    <td th:text="${u.codigo}"></td>
                    <td th:text="${u.cantidadPedidos}"></td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/admin/festivales/{id}/unidades(id=${festival.id})}" class="btn btn-link mt-3">Volver</a>
        </div>
    </div>
</div>

</body>
</html>
