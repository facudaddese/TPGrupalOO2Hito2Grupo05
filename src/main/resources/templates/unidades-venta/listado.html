<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidades de Venta - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${festival.nombre}">Festival</h4>
        </div>
        <div class="card-body">

            <div th:if="${mensajeExito}" class="alert alert-success" role="alert">
                <span th:text="${mensajeExito}"></span>
            </div>

            <div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Unidades de venta</h5>
                    <a th:href="@{/unidades-venta/alta(idFestival=${idFestival})}" class="btn btn-success">
                        + Nueva
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(unidades)}" class="alert alert-info">
                    Sin unidades de venta.
                </div>

                <table th:unless="${#lists.isEmpty(unidades)}" class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre comercial</th>
                        <th>Superficie (m²)</th>
                        <th>Responsable (usuario)</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${unidades}">
                        <td th:text="${u.codigo}"></td>
                        <td th:text="${u.nombreComercial}"></td>
                        <td th:text="${u.superficie}"></td>
                        <td th:text="${u.responsable != null} ? ${u.responsable.nombreUsuario} : '-'"></td>
                        <td>
                            <a th:href="@{/unidades-venta/editar/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-primary">Editar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <a th:href="@{/}" class="btn btn-link mt-3">Volver</a>
        </div>
    </div>
</div>

</body>
</html>
