<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Unidad de Venta - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Unidad de Venta</h4>
        </div>
        <div class="card-body">

            <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                <span th:text="${mensajeError}"></span>
            </div>

            <form th:action="@{/guardar}" th:object="${unidadDTO}" method="post">

                <h5 class="mb-3">Datos de la unidad</h5>

                <!-- El festival es el desde el que se ingresó: se muestra pero no se puede cambiar -->
                <div class="mb-3">
                    <label class="form-label">Festival</label>
                    <input type="text" class="form-control" th:value="${festival.nombre} + ' - ' + ${festival.temporada}" disabled/>
                    <input type="hidden" th:field="*{idFestival}"/>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Superficie (m²)</label>
                        <input type="number" th:field="*{superficie}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de unidad</label>
                    <select th:field="*{tipoUnidad}" id="tipoUnidad" class="form-select" th:errorclass="is-invalid">
                        <option value="">-- Seleccionar tipo --</option>
                        <option value="FOODTRUCK">Food Truck</option>
                        <option value="PUESTO_DESARMABLE">Puesto Desarmable</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{tipoUnidad}"></div>
                </div>

                <!-- Datos propios de un Food Truck -->
                <div id="datosFoodTruck" class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Patente</label>
                        <input type="text" th:field="*{patente}" class="form-control" maxlength="10"/>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" th:field="*{conexion}" class="form-check-input"/>
                            <label class="form-check-label" th:for="${#ids.prev('conexion')}">
                                Requiere conexión eléctrica
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Datos propios de un Puesto Desarmable -->
                <div id="datosPuesto" class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Cantidad de carpas</label>
                        <input type="number" min="1" step="1" th:field="*{cantidadCarpas}" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tiempo de montaje (horas)</label>
                        <input type="number" min="0" step="0.5" th:field="*{tiempoMontaje}" class="form-control"/>
                    </div>
                </div>

                <hr>
                <h5 class="mb-3">Usuario del responsable</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">E-mail usuario</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:errorclass="is-invalid" autocomplete="off"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" th:field="*{password}" class="form-control"
                               th:errorclass="is-invalid" autocomplete="new-password"/>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                        <div class="form-text">Las credenciales se envían por e-mail.</div>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Registrar Unidad de Venta</button>
                    <a th:href="@{/}"
                       class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    // Muestra solo los datos que corresponden al tipo de unidad elegido
    const tipo = document.getElementById('tipoUnidad');
    function mostrarDatosSegunTipo() {
        document.getElementById('datosFoodTruck').style.display = tipo.value === 'FOODTRUCK' ? '' : 'none';
        document.getElementById('datosPuesto').style.display = tipo.value === 'PUESTO_DESARMABLE' ? '' : 'none';
    }
    tipo.addEventListener('change', mostrarDatosSegunTipo);
    mostrarDatosSegunTipo();
</script>

</body>
</html>
