<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis Sueldos</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div th:if="${mensajeError}"
         class="alert alert-danger"
         th:text="${mensajeError}">
    </div>

    <div class="card shadow-sm" th:if="${mensajeError == null}">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Sueldos por Festival</h4>
        </div>

        <div class="card-body">

            <h5 th:text="${empleado.nombre + ' ' + empleado.apellido}"></h5>

            <hr>

            <p>
                <strong>Festival:</strong>
                <span th:text="${festival.nombre}"></span>
            </p>

            <p>
                <strong>Unidad de Venta:</strong>
                <span th:text="${unidad.nombreComercial}"></span>
            </p>

            <div th:if="${#lists.isEmpty(liquidaciones)}"
                 class="alert alert-info">
                No hay liquidaciones disponibles para este festival.
            </div>

            <div class="table-responsive"
                 th:if="${!#lists.isEmpty(liquidaciones)}">

                <table class="table table-striped table-bordered align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Período</th>
                        <th>Tipo</th>
                        <th>Sueldo Base</th>
                        <th>Adicional</th>
                        <th>Días</th>
                        <th>Factor</th>
                        <th>Total</th>
                        <th>Recibo</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="l : ${liquidaciones}">

                        <td>
                            <span th:text="${#temporals.format(l.periodoInicio, 'dd/MM/yyyy')}"></span>
                            al
                            <span th:text="${#temporals.format(l.periodoFin, 'dd/MM/yyyy')}"></span>
                        </td>

                        <td th:text="${l.tipoEmpleado}"></td>

                        <td th:text="${'$ ' + #numbers.formatDecimal(l.sueldoBase, 1, 2)}"></td>

                        <td>
                            <span th:text="${l.plus}"></span>
                            <br>
                            <strong th:text="${'$ ' + #numbers.formatDecimal(l.montoAdicional, 1, 2)}"></strong>
                        </td>

                        <td th:text="${l.diasLiquidacion}"></td>

                        <td th:text="${l.factorDuracion}"></td>

                        <td>
                            <strong th:text="${'$ ' + #numbers.formatDecimal(l.sueldoCalculado, 1, 2)}"></strong>
                        </td>
                        <td>
                            <a th:href="@{/empleado/sueldos/pdf(periodo=${#temporals.format(l.periodoInicio, 'yyyy-MM')})}"
                               class="btn btn-primary btn-sm">
                                <i class="bi bi-file-pdf"></i>
                                Descargar PDF
                            </a>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>
            <a th:href="@{/}"
               class="btn btn-secondary ms-3">
                Volver al inicio
            </a>

        </div>
    </div>

</div>

</body>
</html>
