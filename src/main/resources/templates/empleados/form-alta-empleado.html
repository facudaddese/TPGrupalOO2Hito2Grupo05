<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Empleado - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Nuevo Empleado</h4>
        </div>
        <div class="card-body">

            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${mensajeExito}"></span>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${mensajeError}"></span>
            </div>

            <form th:action="@{/empleados/guardar}" th:object="${empleadoDTO}" method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{apellido}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">DNI</label>
                        <input type="number" th:field="*{dni}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{dni}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Ingreso</label>
                        <input type="date" th:field="*{fechaIngreso}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Sueldo</label>
                        <input type="number" step="0.01" th:field="*{sueldo}" class="form-control"
                               th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{sueldo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Unidad de Venta</label>
                        <select th:field="*{idUnidadVenta}" class="form-select" th:errorclass="is-invalid">
                            <option value="">-- Seleccionar Unidad --</option>
                            <option th:each="u : ${unidadesVenta}" th:value="${u.id}"
                                    th:text="${u.nombreComercial}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{idUnidadVenta}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol / Tipo de Empleado</label>
                    <select id="tipoEmpleado" th:field="*{tipoEmpleado}" class="form-select"
                            onchange="mostrarCamposEspecificos()" th:errorclass="is-invalid">
                        <option value="">-- Seleccionar Tipo --</option>
                        <option value="COCINERO">Cocinero</option>
                        <option value="CAJERO">Cajero</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{tipoEmpleado}"></div>
                </div>

                <div id="divCocinero" class="mb-3 d-none">
                    <label class="form-label">Categoría de Cocinero</label>
                    <select th:field="*{categoriaCocinero}" class="form-select">
                        <option value="">-- Seleccionar Categoría --</option>
                        <option th:each="cat : ${categoriasCocinero}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>

                <div id="divCajero" class="mb-3 d-none">
                    <label class="form-label">Turno de Cajero</label>
                    <select th:field="*{turnoCajero}" class="form-select">
                        <option value="">-- Seleccionar Turno --</option>
                        <option th:each="t : ${turnosCajero}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Registrar Empleado</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    function mostrarCamposEspecificos() {
        const tipo = document.getElementById("tipoEmpleado").value;
        const divCocinero = document.getElementById("divCocinero");
        const divCajero = document.getElementById("divCajero");

        divCocinero.classList.add("d-none");
        divCajero.classList.add("d-none");

        if (tipo === "COCINERO") {
            divCocinero.classList.remove("d-none");
        } else if (tipo === "CAJERO") {
            divCajero.classList.remove("d-none");
        }
    }

    document.addEventListener("DOMContentLoaded", mostrarCamposEspecificos);
</script>

</body>
</html>
