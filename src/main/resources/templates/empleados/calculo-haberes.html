<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Liquidación de Haberes</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Liquidación de Haberes</h4>
        </div>

        <div class="card-body">

            <div th:if="${mensajeError}"
                 class="alert alert-danger"
                 th:text="${mensajeError}">
            </div>

            <div th:if="${mensajeError == null}">

                <div class="mb-4">

                    <h5>
                        Festival:
                        <span th:text="${festival.nombre}"></span>
                    </h5>

                    <p class="mb-1">
                        <strong>Unidad de Venta:</strong>
                        <span th:text="${unidad.nombreComercial}"></span>
                    </p>

                    <p class="mb-0">
                        <strong>Duración total del festival:</strong>
                        <span th:text="${diasFestival}"></span> días
                    </p>

                </div>

                <div class="table-responsive">

                    <table class="table table-striped table-bordered align-middle">

                        <thead class="table-dark">
                        <tr>
                            <th>Empleado</th>
                            <th>Período</th>
                            <th>Tipo</th>
                            <th>Sueldo Base</th>
                            <th>Adicional</th>
                            <th>Días</th>
                            <th>Factor</th>
                            <th>Cálculo</th>
                            <th>Total</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="h : ${haberes}">

                            <td th:text="${h.nombreCompleto}"></td>

                            <td>
                                <span th:text="${#temporals.format(h.periodoInicio, 'dd/MM/yyyy')}"></span>
                                al
                                <span th:text="${#temporals.format(h.periodoFin, 'dd/MM/yyyy')}"></span>
                            </td>

                            <td th:text="${h.tipoEmpleado}"></td>

                            <td th:text="${'$ ' + #numbers.formatDecimal(h.sueldoBase, 1, 2)}"></td>

                            <td>
                                <span th:text="${h.plus}"></span>
                                <br>
                                <strong th:text="${'$ ' + #numbers.formatDecimal(h.montoAdicional, 1, 2)}"></strong>
                            </td>

                            <td th:text="${h.diasLiquidacion}"></td>

                            <td th:text="${h.factorDuracion}"></td>

                            <td>
                                (
                                <span th:text="${'$ ' + #numbers.formatDecimal(h.sueldoBase, 1, 2)}"></span>
                                +
                                <span th:text="${'$ ' + #numbers.formatDecimal(h.montoAdicional, 1, 2)}"></span>
                                )
                                ×
                                <span th:text="${h.factorDuracion}"></span>
                            </td>

                            <td>
                                <strong th:text="${'$ ' + #numbers.formatDecimal(h.sueldoCalculado, 1, 2)}"></strong>
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <div th:if="${#lists.isEmpty(haberes)}"
                     class="alert alert-info">
                    No hay empleados activos en esta Unidad de Venta.
                </div>

            </div>

            <a th:href="@{/responsable/empleados}"
               class="btn btn-secondary mt-3">
                Volver al listado
            </a>
            <a th:href="@{/}"
               class="btn btn-secondary mt-3">
                Volver al Inicio
            </a>


        </div>

    </div>

</div>

</body>
</html>
