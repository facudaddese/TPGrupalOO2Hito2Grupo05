<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liquidación de Sueldos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 class="mb-4 text-primary">Liquidación de Sueldos - Staff</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre Completo</th>
                    <th>DNI</th>
                    <th>Rol / Categoría</th>
                    <th>Fecha Ingreso</th>
                    <th>Sueldo Base</th>
                    <th>Adicional / Plus</th>
                    <th>Total Liquido</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="liq : ${liquidaciones}">
                    <td th:text="${liq.idStaff}">1</td>
                    <td th:text="${liq.nombreCompleto}">Juan Pérez</td>
                    <td th:text="${liq.dni}">35123456</td>
                    <td th:text="${liq.rolOEmpleado}">Cocinero (CHEF)</td>
                    <td th:text="${liq.fechaIngreso}">2023-01-10</td>
                    <td th:text="${'$' + #numbers.formatDecimal(liq.sueldoBase, 1, 'POINT', 2, 'COMMA')}">$850.000,00
                    </td>
                    <td class="text-success"
                        th:text="${'$' + #numbers.formatDecimal(liq.plusOAdicionales, 1, 'POINT', 2, 'COMMA')}">
                        $127.500,00
                    </td>
                    <td class="fw-bold text-primary"
                        th:text="${'$' + #numbers.formatDecimal(liq.totalLiquido, 1, 'POINT', 2, 'COMMA')}">$977.500,00
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(liquidaciones)}">
                    <td colspan="8" class="text-center text-muted">No hay liquidaciones disponibles para mostrar.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
