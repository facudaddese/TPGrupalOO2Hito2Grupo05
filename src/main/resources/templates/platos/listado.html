<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Platos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Platos</h2>
    <a th:href="@{/responsable/platos/nuevo}" class="btn btn-primary">Nuevo Plato</a>
</div>

<p class="text-muted">Unidad de venta: <strong th:text="${nombreUnidad}"></strong></p>

<div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
<div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

<div th:if="${#lists.isEmpty(platos)}" class="alert alert-info">
    Todavía no hay platos registrados.
</div>

<table th:unless="${#lists.isEmpty(platos)}" class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Costo de producción</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${platos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}"></td>
        <td th:text="${#numbers.formatDecimal(p.costoProduccion, 1, 'POINT', 2, 'COMMA')}"></td>
        <td>
            <a th:href="@{/responsable/platos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-link">Volver al inicio</a>

</body>
</html>
