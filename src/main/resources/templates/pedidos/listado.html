<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pedidos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Pedidos</h2>
    <a th:href="@{/responsable/pedidos/nuevo}" class="btn btn-primary">Nuevo Pedido</a>
</div>

<p class="text-muted">Unidad de venta: <strong th:text="${nombreUnidad}"></strong></p>

<div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
<div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

<div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-info">
    Todavía no hay pedidos registrados.
</div>

<table th:unless="${#lists.isEmpty(pedidos)}" class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>N° Pedido</th>
        <th>Fecha</th>
        <th>Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pedidos}">
        <td th:text="${p.id}"></td>
        <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}"></td>
        <td th:text="${'$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}"></td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-link">Volver al inicio</a>

</body>
</html>
