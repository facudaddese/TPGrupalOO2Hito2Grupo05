<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Pedido - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 800px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Alta de Pedido</h4>
        </div>
        <div class="card-body">

            <p class="text-muted">Unidad de venta: <strong th:text="${nombreUnidad}"></strong></p>

            <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                <span th:text="${mensajeError}"></span>
            </div>

            <div th:if="${#lists.isEmpty(platos)}" class="alert alert-warning">
                La unidad de venta no tiene platos cargados. Primero registrá un plato.
            </div>

            <form th:unless="${#lists.isEmpty(platos)}" th:action="@{/responsable/pedidos/guardar}"
                  th:object="${pedidoDTO}" method="post">

                <p class="text-muted small">Completá la cantidad de cada plato. Los que queden en 0 no se incluyen.</p>

                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Plato</th>
                        <th>Precio</th>
                        <th style="width: 160px;">Cantidad</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plato, st : ${platos}">
                        <td th:text="${plato.nombre}"></td>
                        <td th:text="${'$ ' + #numbers.formatDecimal(plato.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <input type="hidden" th:field="*{items[__${st.index}__].idPlato}"/>
                            <input type="number" min="0" step="1" class="form-control"
                                   th:field="*{items[__${st.index}__].cantidad}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{items[__${st.index}__].cantidad}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Registrar pedido</button>
                    <a th:href="@{/responsable/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>

            <a th:if="${#lists.isEmpty(platos)}" th:href="@{/responsable/platos/nuevo}" class="btn btn-primary">Nuevo Plato</a>
        </div>
    </div>
</div>

</body>
</html>
