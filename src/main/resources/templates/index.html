<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>


<header class="navbar">
    <h1>Epicentro Gourmet</h1>

    <div class="navbar-actions">
        <!-- Solo para usuarios NO autenticados -->
        <a class="btn btn-light"
           th:href="@{/login}"
           sec:authorize="isAnonymous()">
            Iniciar sesión
        </a>

        <!-- Solo para usuarios autenticados -->
        <a class="btn btn-light"
           th:href="@{/logout}"
           sec:authorize="isAuthenticated()">
            Cerrar sesión
        </a>
    </div>
</header>



<main class="container">

    <div style="margin-top: 15px;" sec:authorize="hasRole('EMPLEADO')">
        <a
                th:href="@{/empleado/sueldos}"
                class="btn btn-primary">
            Consultar mi sueldo
        </a>
    </div>

    <!-- Responsable: gestión de su unidad -->

    <div class="card" sec:authorize="hasRole('RESPONSABLE')">

                <div class="card-header">
                    <h2>
                        Mi unidad
                        <span th:if="${unidad}" th:text="${': ' + unidad.nombreComercial}"></span>
                    </h2>
                </div>

                <div class="card-body">
                    <!-- Responsable sin unidad asignada -->
                    <p th:if="${mensajeError}" th:text="${mensajeError}" style="color: #b00020;"></p>

                    <div th:if="${unidad}">
                        <p class="festival-info">
                            <strong>Código:</strong> <span th:text="${unidad.codigo}"></span>
                        </p>

                        <a class="btn btn-primary" th:href="@{/responsable/empleados}">Empleados</a>
                        <a class="btn btn-primary" th:href="@{/responsable/platos}">Platos</a>
                        <a class="btn btn-primary" th:href="@{/responsable/pedidos}">Pedidos</a>
                        <a class="btn btn-primary" th:href="@{/responsable/reportes/recaudacion}">Reporte Recaudación</a>
                    </div>
                </div>
    </div>
    <div class="card" sec:authorize="!hasRole('EMPLEADO')">


        <div class="card-header" >
            <h2>Festivales</h2>
        </div>

        <div class="card-body">


            <ul class="festival-list">

                <li class="festival-item"
                    th:each="f : ${festivales}">

                    <h3 class="festival-nombre">
                        <!-- El admin entra al festival para ver sus unidades de venta -->
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/unidades-venta(idFestival=${f.id})}"
                           th:text="${f.nombre}">Nombre del festival</a>
                        <span sec:authorize="!hasRole('ADMIN')" th:text="${f.nombre}">Nombre del festival</span>
                    </h3>

                    <p class="festival-info">
                        <strong>Temporada:</strong>
                        <span th:text="${f.temporada}">Temporada</span>
                    </p>

                    <p class="festival-info">
                        <strong>Fecha:</strong>
                        <span th:text="${f.fechaInicio}">01/01/2026</span>
                        a
                        <span th:text="${f.fechaFin}">10/01/2026</span>
                    </p>

                    <div style="margin-top: 15px;" sec:authorize="hasRole('ADMIN')">
                        <a class="btn btn-light"
                           th:href="@{/admin/festivales/{id}/unidades(id=${f.id})}">
                            Ver Unidades de Venta
                        </a>
                    </div>

                </li>

            </ul>

        </div>

    </div>

</main>

</body>
</html>
